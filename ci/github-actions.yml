name: BEMA Infra CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docker-compose-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose config
        run: |
          docker compose \
            -f bema-infrastructure/docker/docker-compose.yml \
            --env-file bema-infrastructure/env/.env.dev \
            config > /dev/null

      - name: Validate observability compose config
        run: |
          docker compose \
            -f bema-infrastructure/docker/docker-compose.observability.yml \
            --env-file bema-infrastructure/env/.env.dev \
            config > /dev/null

  docker-build:
    runs-on: ubuntu-latest
    needs: docker-compose-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all infra images
        run: |
          docker compose \
            -f bema-infrastructure/docker/docker-compose.yml \
            --env-file bema-infrastructure/env/.env.dev \
            build --no-cache

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Ensure no hardcoded secrets in infra
        run: |
          if grep -r "DB_PASSWORD=" bema-infrastructure/docker 2>/dev/null; then
            echo "❌ Hardcoded DB_PASSWORD found"
            exit 1
          fi

          if grep -r "JWT_SECRET=" bema-infrastructure/docker 2>/dev/null | grep -v "\${JWT_SECRET}"; then
            echo "❌ Hardcoded JWT_SECRET found"
            exit 1
          fi

          echo "✅ Infra secrets clean"

  summary:
    runs-on: ubuntu-latest
    needs: [docker-compose-validation, docker-build, security-scan]
    if: always()

    steps:
      - name: CI Summary
        run: |
          echo "## 🚀 BEMA Infra CI"
          echo ""
          echo "✅ docker-compose validated"
          echo "✅ docker images built"
          echo "✅ security scan completed"
          echo ""
          echo "Infra orchestration layer is valid"