services:
  # ─────────────────────────────────────────────────────────────────────────────
  # TEMPO (Tracing)
  # ─────────────────────────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.10.7@sha256:032b3acb51ed02c4b801473d54bb63e9e9f13738d215126d9843c30283794f4b
    container_name: bema-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks:
      - bema-net

  # ─────────────────────────────────────────────────────────────────────────────
  # OPENTELEMETRY COLLECTOR
  # ─────────────────────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector:0.156.0@sha256:0beba82d63792511591522a8d582904b9a8ae81710357bfcab731607b8b0ffe2
    container_name: bema-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - bema-net
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # POSTGRES EXPORTERS
  # ─────────────────────────────────────────────────────────────────────────────
  postgres-exporter-user:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    command: ["--config.file=/etc/postgres-exporter.yml"]
    container_name: bema-postgres-exporter-user
    volumes:
      - ../observability/postgres-exporter.yml:/etc/postgres-exporter.yml:ro
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres-user:5432/${USER_DB}?sslmode=disable"
    networks:
      - bema-net
    depends_on:
      postgres-user:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-policy:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    command: ["--config.file=/etc/postgres-exporter.yml"]
    container_name: bema-postgres-exporter-policy
    volumes:
      - ../observability/postgres-exporter.yml:/etc/postgres-exporter.yml:ro
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres-policy:5432/${POLICY_DB}?sslmode=disable"
    networks:
      - bema-net
    depends_on:
      postgres-policy:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-identity:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    command: ["--config.file=/etc/postgres-exporter.yml"]
    container_name: bema-postgres-exporter-identity
    volumes:
      - ../observability/postgres-exporter.yml:/etc/postgres-exporter.yml:ro
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres-identity:5432/${IDENTITY_DB}?sslmode=disable"
    networks:
      - bema-net
    depends_on:
      postgres-identity:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-claim:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    command: ["--config.file=/etc/postgres-exporter.yml"]
    container_name: bema-postgres-exporter-claim
    volumes:
      - ../observability/postgres-exporter.yml:/etc/postgres-exporter.yml:ro
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres-claim:5432/${CLAIM_DB}?sslmode=disable"
    networks:
      - bema-net
    depends_on:
      postgres-claim:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # REDIS EXPORTER
  # ─────────────────────────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.86.0@sha256:2e9795be900db073e9475fdb9c5124db309b07a3e4e75a1770705cb03be1a1c8
    container_name: bema-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - bema-net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # PROMETHEUS (Metrics)
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: bema-prometheus
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    networks:
      - bema-net
    depends_on:
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # GRAFANA (Visualization)
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: bema-grafana:13.1.0-hardened
    container_name: bema-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - bema-net
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  tempo_data:
  prometheus_data:
  grafana_data:

# ─────────────────────────────────────────────────────────────────────────────
# NETWORK (shared with main docker-compose)
# ─────────────────────────────────────────────────────────────────────────────
networks:
  bema-net:
    external: true
