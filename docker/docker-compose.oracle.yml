x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # GATEWAY
  # ─────────────────────────────────────────────────────────────────────────────
  gateway-service:
    image: fra.ocir.io/frurj87kcrxi/bema-api-gateway:latest
    logging: *default-logging
    container_name: bema-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - bema-net
    depends_on:
      - user-service
      - policy-service
      - claim-service
      - identity-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGIN_RATE_LIMIT_MAX_REQUESTS: ${LOGIN_RATE_LIMIT_MAX_REQUESTS:-10}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-60000}
      GATEWAY_RATE_LIMIT_MAX_REQUESTS: ${GATEWAY_RATE_LIMIT_MAX_REQUESTS:-300}
      GATEWAY_RATE_LIMIT_WINDOW_MS: ${GATEWAY_RATE_LIMIT_WINDOW_MS:-60000}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ─────────────────────────────────────────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    logging: *default-logging
    image: valkey/valkey:8.1.8-alpine@sha256:cfe71288f087704b06be45e270afa7a2abbf820093d6b11a23762081f5ff321d
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    container_name: bema-redis
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - bema-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3


  # ─────────────────────────────────────────────────────────────────────────────
  # USER SERVICE
  # ─────────────────────────────────────────────────────────────────────────────
  user-service:
    image: fra.ocir.io/frurj87kcrxi/bema-user-service:latest
    logging: *default-logging
    container_name: bema-user-service
    restart: unless-stopped
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/${USER_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      IDENTITY_SERVICE_URL: http://identity-service:8084
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    expose:
      - "8081"
    networks:
      - bema-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ─────────────────────────────────────────────────────────────────────────────
  # POLICY SERVICE
  # ─────────────────────────────────────────────────────────────────────────────
  policy-service:
    image: fra.ocir.io/frurj87kcrxi/bema-policy-service:latest
    logging: *default-logging
    container_name: bema-policy-service
    restart: unless-stopped
    depends_on:
      postgres-policy:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-policy:5432/${POLICY_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      IDENTITY_SERVICE_URL: http://identity-service:8084
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    expose:
      - "8082"
    networks:
      - bema-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ─────────────────────────────────────────────────────────────────────────────
  # CLAIM SERVICE
  # ─────────────────────────────────────────────────────────────────────────────
  claim-service:
    image: fra.ocir.io/frurj87kcrxi/bema-claim-service:latest
    logging: *default-logging
    container_name: bema-claim-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres-claim:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${CLAIM_LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8083
      WEBSOCKET_ORIGIN: ${WEBSOCKET_ORIGIN}
      ENABLE_OTEL: ${ENABLE_OTEL:-false}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres-claim:5432/${CLAIM_DB}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    expose:
      - "8083"
    networks:
      - bema-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const r=http.get('http://127.0.0.1:8083/api/claims/actuator/health',res=>{res.resume();process.exit(res.statusCode===200?0:1)});r.setTimeout(4000,()=>r.destroy());r.on('error',()=>process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ─────────────────────────────────────────────────────────────────────────────
  # CLAIM MIGRATIONS (SEPARATE SERVICE)
  # ─────────────────────────────────────────────────────────────────────────────
  claim-migrations:
    image: fra.ocir.io/frurj87kcrxi/bema-claim-migrations:latest
    logging: *default-logging
    container_name: bema-claim-migrations
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      postgres-claim:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres-claim:5432/${CLAIM_DB}
    networks:
      - bema-net

  # ─────────────────────────────────────────────────────────────────────────────
  # IDENTITY SERVICE (FIXED)
  # ─────────────────────────────────────────────────────────────────────────────
  identity-service:
    image: fra.ocir.io/frurj87kcrxi/bema-identity-service:latest
    logging: *default-logging
    container_name: bema-identity-service
    restart: unless-stopped

    expose:
      - "8084"

    networks:
      - bema-net

    depends_on:
      postgres-identity:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      # DB (FIXED: now consistent + injectable)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-identity:5432/${IDENTITY_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      # REDIS TOKEN REVOCATION
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # OPTIONAL ADMINISTRATOR BOOTSTRAP
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}

      # SERVICE COMMUNICATION
      USER_SERVICE_URL: http://user-service:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ─────────────────────────────────────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    image: fra.ocir.io/frurj87kcrxi/bema-frontend:latest
    logging: *default-logging
    container_name: bema-frontend
    restart: unless-stopped
    depends_on:
      - gateway-service
    ports:
      - "4200:8080"
    networks:
      - bema-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


  # ─────────────────────────────────────────────────────────────────────────────
  # DATABASES
  # ─────────────────────────────────────────────────────────────────────────────

  postgres-user:
    logging: *default-logging
    image: bema-postgres:17.10-alpine-patched
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=500"]
    container_name: bema-user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USER_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - bema-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${USER_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-policy:
    logging: *default-logging
    image: bema-postgres:17.10-alpine-patched
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=500"]
    container_name: bema-policy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POLICY_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - policy_db_data:/var/lib/postgresql/data
    networks:
      - bema-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POLICY_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-claim:
    logging: *default-logging
    image: bema-postgres:17.10-alpine-patched
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=500"]
    container_name: bema-claim-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLAIM_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - claim_db_data:/var/lib/postgresql/data
    networks:
      - bema-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${CLAIM_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-identity:
    logging: *default-logging
    image: bema-postgres:17.10-alpine-patched
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=500"]
    container_name: bema-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    networks:
      - bema-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${IDENTITY_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  user_db_data:
  policy_db_data:
  claim_db_data:
  identity_db_data:


# ─────────────────────────────────────────────────────────────────────────────
# NETWORK
# ─────────────────────────────────────────────────────────────────────────────
networks:
  bema-net:
    name: bema-net
    driver: bridge
