global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bema-cluster'
    environment: dev

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # Gateway Service
  - job_name: 'gateway-service'
    static_configs:
      - targets: ['gateway-service:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Identity Service
  - job_name: 'identity-service'
    static_configs:
      - targets: ['identity-service:8084']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s

  # User Service
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8081']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Policy Service
  - job_name: 'policy-service'
    static_configs:
      - targets: ['policy-service:8082']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Claim Service
  - job_name: 'claim-service'
    static_configs:
      - targets: ['claim-service:8083']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # PostgreSQL Exporters
  - job_name: 'postgres-user'
    static_configs:
      - targets: ['postgres-exporter-user:9187']
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'postgres-policy'
    static_configs:
      - targets: ['postgres-exporter-policy:9187']
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'postgres-identity'
    static_configs:
      - targets: ['postgres-exporter-identity:9187']
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'postgres-claim'
    static_configs:
      - targets: ['postgres-exporter-claim:9187']
    scrape_interval: 15s
    scrape_timeout: 10s

  # Tempo traces
  # - job_name: 'tempo'
  #   static_configs:
  #     - targets: ['tempo:3200']
  #   scrape_interval: 15s

  # Grafana monitoring
  # - job_name: 'grafana'
  #   static_configs:
  #     - targets: ['grafana:3000']
  #   scrape_interval: 15s
